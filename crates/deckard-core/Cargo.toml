[package]
name = "deckard-core"
version = "0.0.1-alpha"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Deckard's headless engine: Ethereum provider, balances, HD keys, and the encrypted keystore — no GPUI dependency, fully unit-testable."

[features]
# Embedded Helios light client → verified localhost reads. Heavy (revm/bls); ON by
# default so the app + daemon get verified reads, but toggleable so the heavy build
# can be skipped. When OFF, reads fall back to the raw RPC and are tagged
# ReadStatus::Unsynced("verification disabled") — never silently Verified.
default = ["verified-reads", "shield", "cow-client"]
verified-reads = ["dep:helios-ethereum"]
# CoW Protocol orderbook REST client (Swap v1). ON by default so the app + MCP can quote and
# submit swaps; toggleable so the signer daemon — which builds core with
# `default-features = false` — never compiles the HTTP client. When OFF, only the pure
# `cow_types` module (digest/uid/cancel calldata) is present; there is no fake-success stub
# because nothing is named when the feature is absent.
cow-client = ["dep:reqwest", "dep:serde", "dep:serde_json"]
# Key-less Railgun shield-calldata builder. Heavy (the full ZK `railgun` tree); ON by
# default so the app + daemon can build shield intents, but toggleable so the heavy build
# can be skipped. When OFF, `build_shield_native_intent` returns "shield unavailable
# (feature off)" — never a fake success. Pulls `rand_09` because railgun pins rand 0.9
# while core's own `rand` stays 0.8.
shield = ["dep:railgun", "dep:rand_09", "dep:hmac", "dep:sha2"]

[dependencies]
# The frozen wire contract — only for the shared `ReadStatus` trust label attached
# to every read. (Types-only; no key material, no logic.)
deckard-contract = { path = "../deckard-contract" }

# The full alloy surface Deckard needs across chunks. Front-loaded so the heavy
# alloy/reqwest compile happens once: provider+http (reads), contract+sol-types
# (Multicall3 / ERC-20), ens (name resolution), eips (BlockId for the Helios
# `with_default_block(latest)` fix). signer-local stays standalone below to keep
# the `mnemonic` feature explicit.
alloy = { version = "1", features = ["provider-http", "contract", "sol-types", "ens", "eips"] }
alloy-signer-local = { version = "2.0.5", features = ["mnemonic"] }
alloy-primitives = "1.6.0"

# CoW Protocol orderbook REST client (the only direct HTTP in core). Gated behind `cow-client`
# (DEFAULT ON) so the signer daemon (built `--no-default-features`) never compiles it. reqwest
# is ALREADY in Cargo.lock via alloy (provider-http) — this direct line is the pre-approved
# edge, NOT a new dependency. Pin to `0.12` to reuse alloy's already-resolved reqwest 0.12.28
# (the lock also carries a transitive 0.13.4 from another tree; depending on `0.12` reuses the
# existing 0.12.28 and adds NO new reqwest version). We request ONLY `json` (default-features
# off so we don't pull reqwest's default native-tls stack); the TLS backend comes for free from
# alloy's own reqwest features via Cargo feature unification — specifying our own `rustls-tls`
# would pull a SECOND root-cert crate (webpki-roots 1.0), so we deliberately don't.
reqwest = { version = "0.12", default-features = false, features = ["json"], optional = true }
# The CoW orderbook request/response structs (de)serialize via serde + serde_json. Both are
# already deep in Cargo.lock (serde via alloy-primitives, serde_json via reqwest's `json`
# feature); these optional direct edges only surface them to the `cow-client` module and add
# NO new version to the lock. Gated with `cow-client` so the no-default-features daemon build
# never pulls them on core's account.
serde = { version = "1", features = ["derive"], optional = true }
serde_json = { version = "1", optional = true }

# Embedded Helios light client (verified localhost JSON-RPC server). Git-only,
# pinned past 0.11.1 because a16z/helios#804 disables unused jsonrpsee client
# transports that otherwise leak into downstream security reports. The umbrella
# `helios` crate pulls a yanked core2, so depend on `helios-ethereum` directly.
# Heavy (revm/bls12_381) — gated behind `verified-reads`. The `ethereum_hashing`
# patch it needs is at the workspace root (a git-dep can't carry its own `[patch]`).
helios-ethereum = { git = "https://github.com/a16z/helios", rev = "43a8c9f3cdda41a6f383c4db41d9a83f102638b1", optional = true }

# Kohaku's pure-Rust Railgun client — the heavy ZK crate. Gated behind `shield` (DEFAULT
# ON). We use ONLY the key-less `ShieldBuilder` (no sync, no proving, no key), but the crate
# pulls the full ZK tree, so it is `optional`. `testing` matches the proven spike edge (rev
# 618c53f) so the workspace-root `[patch.crates-io]` set resolves identically. The two
# mandatory ZK patches (ruint, ark-circom) live at the workspace root — a git-dep can't
# carry its own `[patch]`.
railgun = { git = "https://github.com/ethereum/kohaku", package = "railgun", rev = "618c53facd0d44cf0f01d74e0dcc18d2242351c7", features = ["testing"], optional = true }
# railgun's `ShieldBuilder::build<R: Rng>` requires a rand **0.9** Rng; core's own `rand`
# (below) is 0.8 (RustCrypto-aligned), so the 0.9 crate is aliased `rand_09` and pulled only
# with the `shield` feature.
rand_09 = { package = "rand", version = "0.9", optional = true }
# SLIP-0010 ed25519 derivation for the Railgun 0zk keys (railgun_keys.rs): HMAC-SHA512 only.
# Audited RustCrypto primitives, the same family as argon2/chacha20poly1305/bip39 above, and
# already present transitively (bip39's pbkdf2 pulls them) — these add only the direct edges.
# Gated with `shield` since the derivation feeds the railgun key types.
hmac = { version = "0.12", optional = true }
sha2 = { version = "0.10", optional = true }

# A single background tokio runtime owns all network; the GUI thread never makes
# a network call. `rt` (current-thread) only — no multi-thread worker pool needed.
tokio = { version = "1", features = ["rt", "macros", "sync"] }
# Runtime-agnostic channel: its `recv_async()` future resolves on GPUI's own
# executor, so results bridge to the UI thread without blocking.
flume = "0.11"
anyhow = "1"

# --- Encrypted keystore (Chunk 3) — audited RustCrypto primitives only ---
# Argon2id KEK (memory-hard, PHC winner) + XChaCha20-Poly1305 AEAD (NCC-audited);
# bip39 owns entropy<->mnemonic with a zeroize feature; alloy derives the signer.
argon2 = "0.5"
chacha20poly1305 = "0.10"
bip39 = { version = "2.2", features = ["zeroize"] }
zeroize = "1"
rand = "0.8"

# Resolve the platform config dir (the keystore + signer policy live there). Single-sourced
# here so the GUI app, onboarding, and the signer daemon all agree on the path.
directories = "5"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "macros", "sync", "rt-multi-thread"] }

# Inherit the workspace lint policy (see root Cargo.toml [workspace.lints]). deckard-core also sets
# #![forbid(unsafe_code)] in lib.rs — the security engine is a pure-safe, compile-time guarantee.
[lints]
workspace = true
