[package]
name = "deckard-mcp"
version = "0.0.1-alpha"
edition = "2021"
license = "AGPL-3.0-or-later"
description = "Deckard's key-less agent surface: one binary that is both a CLI and an MCP stdio server (mcp.v0.1 — 6 tools). It holds no key material; every write is an Intent proposed to the process-isolated deckard-signerd, which enforces policy and signs."

# lib + bin like signerd: the lib holds the tool/CLI logic (unit-testable, reused by the
# acceptance tests); the bin is the entry point Claude Desktop registers.
[lib]
name = "deckard_mcp"
path = "src/lib.rs"

[[bin]]
name = "deckard-mcp"
path = "src/main.rs"

[dependencies]
# The frozen wire contract + the key-less socket client (re-exported from signerd).
deckard-contract = { path = "../deckard-contract" }
deckard-signerd = { path = "../deckard-signerd", default-features = false }
# Only the key-less shield-calldata builder (`shield`); no verified-reads — the sidecar
# reads balances THROUGH the daemon, it never owns an RPC/Helios client.
deckard-core = { path = "../deckard-core", default-features = false, features = ["shield"] }

# The official Rust MCP SDK (approved dep): stdio transport + #[tool] macros. Its `schemars`
# re-export drives the tool input schemas — no separate direct schemars dependency.
rmcp = { version = "1.7", features = ["server", "transport-io"] }
# CLI parsing (approved dep).
clap = { version = "4", features = ["derive"] }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "signal"] }
serde = { workspace = true }
serde_json = "1"
alloy-primitives = { workspace = true }
zeroize = "1"
anyhow = "1"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "io-util", "process", "sync"] }

# Inherit the workspace lint policy (root Cargo.toml [workspace.lints]).
[lints]
workspace = true
